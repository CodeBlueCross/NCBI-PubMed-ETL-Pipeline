steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: [ 'build', '-t', 'us-central1-docker.pkg.dev/physicianscopilot/pubmed-repo/pipeline:v1', '.' ]

  # Step 2: Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: [ 'push', 'us-central1-docker.pkg.dev/physicianscopilot/pubmed-repo/pipeline:v1' ]

images:
  - 'us-central1-docker.pkg.dev/physicianscopilot/pubmed-repo/pipeline:v1'

options:
  logging: CLOUD_LOGGING_ONLY
